<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rheian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a040f;
    --deep:#1a0a20;
    --pink:#ff4fa8;
    --pink-soft:#ff9dc9;
    --gold:#ffd76f;
    --ink:#5a2340;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--void);color:#fff;font-family:'Poppins',sans-serif;overflow:hidden;}
  #bgGlow{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(55% 45% at 22% 15%, rgba(255,79,168,0.22), transparent 60%),
      radial-gradient(50% 45% at 82% 85%, rgba(180,110,255,0.16), transparent 60%),
      var(--void);
  }
  #stars{ position:fixed; inset:0; z-index:1; }
  #heartLayer{ position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .floatHeart{ position:absolute; bottom:-40px; opacity:0; animation:floatUp linear forwards; pointer-events:none; filter:drop-shadow(0 0 6px rgba(255,79,168,0.5)); }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(0,0) scale(0.6) rotate(0deg); }
    10%{ opacity:0.9; }
    90%{ opacity:0.65; }
    100%{ opacity:0; transform:translate(var(--dx,20px),-112vh) scale(1.15) rotate(25deg); }
  }
  .sparkle{ position:absolute; color:#ffe9f4; opacity:0; animation:sparkleTwinkle 2.4s ease-in-out infinite; pointer-events:none; }
  @keyframes sparkleTwinkle{ 0%,100%{ opacity:0; transform:scale(0.5); } 50%{ opacity:1; transform:scale(1.1); } }

  #musicBtn{
    position:fixed; top:18px; right:18px; z-index:60;
    background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.28); color:#fff;
    border-radius:100px; padding:9px 16px; font-size:12px; font-family:'Poppins',sans-serif; cursor:pointer;
    backdrop-filter:blur(8px); transition:background 0.2s ease, transform 0.2s ease; opacity:0;
  }
  #musicBtn.show{ opacity:1; }
  #musicBtn:hover{ background:rgba(255,255,255,0.18); transform:translateY(-1px); }

  .scene{ position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px; opacity:0; pointer-events:none; transition:opacity 0.7s ease; }
  .scene.show{ opacity:1; pointer-events:auto; }

  /* ---------- start screen ---------- */
  #startScene{ gap:6px; }
  .startEyebrow{ font-size:12px; letter-spacing:0.25em; text-transform:uppercase; color:var(--pink-soft); margin-bottom:10px; }
  .startTitle{ font-family:'Dancing Script',cursive; font-weight:700; font-size:clamp(34px,8vw,58px); color:#fff; text-shadow:0 0 30px rgba(255,79,168,0.5); }
  .startSub{ font-size:13px; color:rgba(255,255,255,0.55); margin-top:10px; max-width:340px; }
  #startBtn{
    margin-top:36px; background:linear-gradient(135deg,var(--pink),#ff8fc4); border:none; color:#fff;
    border-radius:100px; padding:15px 34px; font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 12px 34px rgba(255,79,168,0.45); transition:transform 0.25s ease, box-shadow 0.25s ease;
  }
  #startBtn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 16px 40px rgba(255,79,168,0.6); }

  /* ---------- intro matrix reveal ---------- */
  #introScene{ padding:0; }
  #matrixCanvas{ width:100%; height:100%; display:block; }
  #skipIntro{
    position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.3); color:rgba(255,255,255,0.8);
    border-radius:100px; padding:8px 18px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
    backdrop-filter:blur(6px);
  }

  /* ---------- cute transition ---------- */
  .cuteHeartWrap{ position:relative; width:140px; height:140px; }
  .cuteRing{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(255,143,196,0.4); animation:ringGrow 2.4s ease-out infinite; }
  .cuteRing.r2{ animation-delay:0.8s; }
  @keyframes ringGrow{ 0%{ transform:scale(0.6); opacity:0.8; } 100%{ transform:scale(1.6); opacity:0; } }
  .cuteHeartSvg{ width:100%; height:100%; filter:drop-shadow(0 0 26px rgba(255,79,168,0.75)); animation:cutePulse 1.6s ease-in-out infinite; }
  @keyframes cutePulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .cuteLine{ margin-top:30px; font-family:'Dancing Script',cursive; font-size:clamp(24px,5vw,40px); color:#ffe3f0; opacity:0; animation:cuteFadeIn 1s ease forwards 0.6s; }
  @keyframes cuteFadeIn{ to{ opacity:1; } }
  #cuteScene .scrollTap{ margin-top:44px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.5); opacity:0; animation:cuteFadeIn 1s ease forwards 2.2s; cursor:pointer; padding:8px 16px; border:1px solid rgba(255,255,255,0.2); border-radius:100px; }

  /* ---------- message + photo slides ---------- */
  #slideScene{ gap:0; }
  .msgCard{
    position:relative; background:linear-gradient(165deg,#fff,#fff5fa); color:var(--ink); border-radius:22px;
    padding:24px 54px 24px 30px; max-width:600px; width:90%;
    box-shadow:0 25px 65px rgba(255,79,168,0.4), 0 0 0 1px rgba(255,255,255,0.6) inset;
    margin-bottom:30px; font-family:'Dancing Script',cursive; font-weight:700; font-size:clamp(19px,3.8vw,29px); line-height:1.45;
    min-height:1.4em; transform:translateY(10px); opacity:0; animation:cardIn 0.6s cubic-bezier(.2,.8,.3,1.1) forwards;
  }
  @keyframes cardIn{ to{ transform:translateY(0); opacity:1; } }
  .cardHeart{ position:absolute; top:16px; right:20px; font-size:19px; animation:cutePulse 1.8s ease-in-out infinite; }
  .photoPairWrap{ position:relative; perspective:1500px; }
  .photoPair{
    display:flex; gap:3px; width:min(440px,88vw); border-radius:16px; overflow:hidden;
    box-shadow:0 28px 75px rgba(0,0,0,0.55); border:3px solid rgba(255,255,255,0.9);
    transform:translateY(10px); opacity:0; animation:cardIn 0.6s cubic-bezier(.2,.8,.3,1.1) forwards 0.1s;
  }
  .pageHalf{ position:relative; width:50%; height:340px; backface-visibility:hidden; transition:transform 0.42s cubic-bezier(.5,0,.75,0); }
  #pageL{ transform-origin:right center; }
  #pageR{ transform-origin:left center; }
  .pageHalf img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pageShade{ position:absolute; inset:0; background:rgba(0,0,0,0); transition:background 0.42s ease; pointer-events:none; }
  .photoPair.folded #pageL{ transform:rotateY(-96deg); transition-timing-function:cubic-bezier(.5,0,.75,0); }
  .photoPair.folded #pageR{ transform:rotateY(96deg); transition-timing-function:cubic-bezier(.5,0,.75,0); }
  .photoPair.folded .pageShade{ background:rgba(0,0,0,0.55); }
  .photoPair.opening #pageL, .photoPair.opening #pageR{ transition-timing-function:cubic-bezier(.2,.9,.3,1.3); }
  #slideDots{ display:flex; gap:7px; margin-top:22px; }
  .slideDot{ width:6px;height:6px;border-radius:50%; background:rgba(255,255,255,0.25); transition:background 0.3s ease, transform 0.3s ease; }
  .slideDot.on{ background:var(--pink); transform:scale(1.4); box-shadow:0 0 8px rgba(255,79,168,0.8); }
  #slideScene .navHint{ margin-top:16px; font-size:11px; color:rgba(255,255,255,0.45); letter-spacing:0.08em; text-transform:uppercase; }

  /* ---------- final heart collage ---------- */
  #finalGlow{ position:absolute; width:520px;height:520px; border-radius:50%; background:radial-gradient(circle, rgba(255,79,168,0.28), transparent 68%); filter:blur(10px); z-index:-1; }
  #heartCollage{ position:relative; width:min(560px,92vw); height:min(500px,72vh); }
  .heartCard{
    position:absolute; left:50%; top:50%; width:72px; height:88px; margin-left:-36px; margin-top:-44px;
    border-radius:9px; overflow:hidden;
    border:2px solid rgba(255,255,255,0.92); box-shadow:0 0 22px rgba(255,79,168,0.6);
    transform:translate(0,0) rotate(0deg) scale(0.5); opacity:0;
    transition:transform 0.75s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
  }
  .heartCard.stacked{ opacity:1; }
  .heartCard.placed{ animation:heartFloat 3.4s ease-in-out infinite; }
  .heartCard img{ width:100%;height:100%;object-fit:cover;display:block; }
  @keyframes heartFloat{ 0%,100%{ transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1); } 50%{ transform:translate(var(--tx),calc(var(--ty) - 8px)) rotate(var(--rot)) scale(1); } }
  .finalMsg{ margin-top:26px; font-family:'Dancing Script',cursive; font-weight:700; font-size:clamp(23px,4.6vw,34px); color:#ffe3f0; line-height:1.5; max-width:560px; text-shadow:0 0 20px rgba(255,79,168,0.3); }
  .finalSub{ margin-top:14px; font-size:12px; letter-spacing:0.06em; color:rgba(255,255,255,0.55); }
  #replayBtn{
    margin-top:24px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.32); color:#fff;
    border-radius:100px; padding:12px 26px; font-size:12px; cursor:pointer; letter-spacing:0.05em;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  #replayBtn:hover{ background:rgba(255,255,255,0.2); transform:translateY(-1px); }

  @media (max-width:520px){
    .photoPair img{ height:250px; }
    #heartCollage{ transform:scale(0.85); }
  }
</style>
</head>
<body>

<div id="bgGlow"></div>
<canvas id="stars"></canvas>
<div id="heartLayer"></div>
<button id="musicBtn">⏸ Pause Music</button>

<div class="scene show" id="startScene">
  <div class="startEyebrow">a little something</div>
  <div class="startTitle">For Rheian</div>
  <div class="startSub">Turn your sound on — this one's better with music.</div>
  <button id="startBtn">▶ Open it</button>
</div>

<div class="scene" id="introScene">
  <canvas id="matrixCanvas"></canvas>
  <button id="skipIntro">skip →</button>
</div>

<div class="scene" id="cuteScene">
  <div class="cuteHeartWrap">
    <div class="cuteRing"></div>
    <div class="cuteRing r2"></div>
    <svg class="cuteHeartSvg" viewBox="0 0 32 29"><path fill="#ff4fa8" d="M16 29C16 29 0 18.5 0 8.8 0 3.4 4.2 0 8.6 0c3.2 0 5.8 1.8 7.4 4.6C17.6 1.8 20.2 0 23.4 0 27.8 0 32 3.4 32 8.8 32 18.5 16 29 16 29Z"/></svg>
  </div>
  <div class="cuteLine">I made something for you...</div>
  <div class="scrollTap" id="cuteTap">tap to continue</div>
</div>

<div class="scene" id="slideScene">
  <div class="msgCard" id="msgCard"><span id="msgText"></span><span class="cardHeart">💕</span></div>
  <div class="photoPairWrap">
    <div class="photoPair" id="photoPair">
      <div class="pageHalf" id="pageL"><img id="photoL" src=""><div class="pageShade"></div></div>
      <div class="pageHalf" id="pageR"><img id="photoR" src=""><div class="pageShade"></div></div>
    </div>
  </div>
  <div id="slideDots"></div>
  <div class="navHint">tap anywhere to continue</div>
</div>

<div class="scene" id="finalScene">
  <div id="finalGlow"></div>
  <div id="heartCollage"></div>
  <div class="finalMsg">Thank you for being you.<br>I appreciate you, endlessly.</div>
  <div class="finalSub">— Jastine, for Rheian</div>
  <button id="replayBtn">↻ Watch again</button>
</div>

(function(){
  /* ---------------- starfield ---------------- */
  const starCanvas = document.getElementById('stars');
  const sctx = starCanvas.getContext('2d');
  let stars = [];
  function resizeStars(){
    starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight;
    const count = Math.min(130, Math.floor(window.innerWidth*window.innerHeight/8500));
    stars = Array.from({length:count}, () => ({
      x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
      r: Math.random()*1.3+0.3, a: Math.random()*0.6+0.2, phase: Math.random()*Math.PI*2, speed: Math.random()*0.5+0.2
    }));
  }
  resizeStars();
  window.addEventListener('resize', resizeStars);
  let t0 = performance.now();
  function drawStars(now){
    const dt = (now-t0)/1000; t0 = now;
    sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
    stars.forEach(s => {
      s.phase += dt*s.speed;
      const a = s.a + Math.sin(s.phase)*0.2;
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      sctx.fillStyle = 'rgba(255,255,255,'+Math.max(0,a)+')';
      sctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  requestAnimationFrame(drawStars);

  /* ---------------- floating hearts + sparkles ---------------- */
  const heartLayer = document.getElementById('heartLayer');
  const heartEmojis = ['💗','💕','💖','💓'];
  function spawnHeart(){
    const el = document.createElement('div');
    el.className = 'floatHeart';
    el.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    el.style.left = (Math.random()*94+2) + 'vw';
    el.style.fontSize = (14+Math.random()*16)+'px';
    el.style.setProperty('--dx', (Math.random()*140-70)+'px');
    const dur = 9+Math.random()*7;
    el.style.animationDuration = dur+'s';
    heartLayer.appendChild(el);
    setTimeout(()=>el.remove(), dur*1000+400);
  }
  setInterval(spawnHeart, 850);
  spawnHeart(); spawnHeart();

  /* ---------------- background music ---------------- */
  const bgSong = document.getElementById('bgSong');
  const musicBtn = document.getElementById('musicBtn');
  let musicOn = true;
  function tryPlaySong(){
    const p = bgSong.play();
    if (p && p.catch) p.catch(()=>{});
  }
  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    if (musicOn){ tryPlaySong(); musicBtn.textContent = '⏸ Pause Music'; }
    else { bgSong.pause(); musicBtn.textContent = '▶ Play Music'; }
  });

  /* ---------------- scene switching ---------------- */
  const scenes = {
    start: document.getElementById('startScene'),
    intro: document.getElementById('introScene'),
    cute: document.getElementById('cuteScene'),
    slide: document.getElementById('slideScene'),
    final: document.getElementById('finalScene')
  };
  function showScene(name){
    Object.values(scenes).forEach(s => s.classList.remove('show'));
    scenes[name].classList.add('show');
  }

  /* ---------------- start screen (unlocks audio on real user gesture) ---------------- */
  document.getElementById('startBtn').addEventListener('click', () => {
    bgSong.volume = 1;
    tryPlaySong();
    musicBtn.classList.add('show');
    showScene('intro');
    runMatrixIntro(goToCute);
  });

  /* ---------------- intro: matrix word reveal ---------------- */
  const matrixCanvas = document.getElementById('matrixCanvas');
  const mctx = matrixCanvas.getContext('2d');
  const introWords = ['3', '2', '1', 'I', 'LOVE', 'YOU,', 'RHEIAN'];
  const introDurations = [55, 55, 55, 110, 110, 110, 150];
  let matrixStopped = false;

  function runMatrixIntro(onDone){
    matrixStopped = false;
    function resize(){ matrixCanvas.width = matrixCanvas.clientWidth; matrixCanvas.height = matrixCanvas.clientHeight; }
    resize();
    const cell = Math.max(14, Math.min(24, Math.floor(window.innerWidth/46)));
    let cols = Math.ceil(matrixCanvas.width/cell);
    let rows = Math.ceil(matrixCanvas.height/cell);
    let drops = Array(cols).fill(0).map(()=>Math.random()*20);
    const glyphs = '01アイウエオカキクケコサシスセソ'.split('');
    let wordIdx = 0;
    let insideCells = [];

    function computeInsideCells(word){
      const off = document.createElement('canvas');
      off.width = matrixCanvas.width; off.height = matrixCanvas.height;
      const octx = off.getContext('2d');
      let fs = Math.min(matrixCanvas.width/(word.length*0.62), matrixCanvas.height*0.32);
      octx.font = '900 ' + fs + 'px Arial, sans-serif';
      octx.textAlign = 'center'; octx.textBaseline = 'middle';
      octx.fillStyle = '#fff';
      octx.fillText(word, matrixCanvas.width/2, matrixCanvas.height/2);
      const data = octx.getImageData(0, 0, matrixCanvas.width, matrixCanvas.height).data;
      const cellsList = [];
      for (let r=0; r<rows; r++){
        for (let c=0; c<cols; c++){
          const px = Math.min(matrixCanvas.width-1, c*cell + cell/2);
          const py = Math.min(matrixCanvas.height-1, r*cell + cell/2);
          const idx = (Math.floor(py)*matrixCanvas.width + Math.floor(px))*4 + 3;
          if (data[idx] > 120){
            cellsList.push({ r, c, glyph: glyphs[Math.floor(Math.random()*glyphs.length)] });
          }
        }
      }
      return cellsList;
    }
    insideCells = computeInsideCells(introWords[0]);
    let frame = 0;

    function draw(){
      if (matrixStopped) return;
      mctx.fillStyle = 'rgba(6,2,10,0.18)';
      mctx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);
      mctx.font = cell + 'px monospace';

      // falling background rain
      for (let c=0; c<cols; c++){
        const x = c*cell;
        const y = drops[c]*cell;
        mctx.fillStyle = 'rgba(255,60,160,0.3)';
        mctx.fillText(glyphs[Math.floor(Math.random()*glyphs.length)], x, y);
        drops[c] += 0.85;
        if (drops[c]*cell > matrixCanvas.height && Math.random() > 0.975) drops[c] = 0;
      }

      // solid letter overlay — always fully drawn, every frame
      mctx.font = '700 ' + Math.round(cell*1.05) + 'px monospace';
      insideCells.forEach(cell2 => {
        if (Math.random() < 0.015) cell2.glyph = glyphs[Math.floor(Math.random()*glyphs.length)];
        mctx.fillStyle = '#ff4fa8';
        mctx.shadowColor = '#ff4fa8';
        mctx.shadowBlur = 8;
        mctx.fillText(cell2.glyph, cell2.c*cell, cell2.r*cell + cell);
        mctx.shadowBlur = 0;
      });

      frame++;
      if (frame < introDurations[wordIdx]){ requestAnimationFrame(draw); }
      else {
        wordIdx++;
        if (wordIdx < introWords.length){ insideCells = computeInsideCells(introWords[wordIdx]); frame = 0; requestAnimationFrame(draw); }
        else { onDone && onDone(); }
      }
    }
    draw();
  }

  document.getElementById('skipIntro').addEventListener('click', () => {
    matrixStopped = true;
    goToCute();
  });

  function goToCute(){
    showScene('cute');
  }

  /* ---------------- cute transition ---------------- */
  document.getElementById('cuteTap').addEventListener('click', () => { startSlides(); });
  let cuteAutoTimer = null;

  /* ---------------- message + photo slides ---------------- */
  const messages = [
    "This isn't for any occasion. Just because you deserve it.",
    "As long as you're smiling, I'm happy too.",
    "Thank you for choosing me, every single day.",
    "You make ordinary days feel like something worth keeping.",
    "I don't say it enough, so let this be the reminder.",
    "Every photo of you is my favorite one.",
    "You are the softest place I've ever landed.",
    "This is just a little appreciation... for my favorite person."
  ];
  const msgCard = document.getElementById('msgCard');
  const msgText = document.getElementById('msgText');
  const photoPair = document.getElementById('photoPair');
  const photoL = document.getElementById('photoL');
  const photoR = document.getElementById('photoR');
  const slideDotsWrap = document.getElementById('slideDots');
  let slideIdx = 0;
  let slideTimer = null;
  let typeTimer = null;

  messages.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'slideDot';
    slideDotsWrap.appendChild(d);
  });
  function updateDots(){
    [...slideDotsWrap.children].forEach((d,i) => d.classList.toggle('on', i === slideIdx));
  }

  function typeMessage(text, onDone){
    msgText.textContent = '';
    let i = 0;
    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
      i++;
      msgText.textContent = text.slice(0, i);
      if (i >= text.length){ clearInterval(typeTimer); onDone && onDone(); }
    }, 32);
  }

  function renderSlide(i){
    updateDots();
    const p1 = RHEIAN_PHOTOS[i % RHEIAN_PHOTOS.length];
    const p2 = RHEIAN_PHOTOS[(i+2) % RHEIAN_PHOTOS.length];

    msgCard.style.animation = 'none'; void msgCard.offsetWidth; msgCard.style.animation = '';

    if (i === 0){
      photoPair.style.animation = 'none'; void photoPair.offsetWidth; photoPair.style.animation = '';
      photoL.src = p1; photoR.src = p2;
    } else {
      photoPair.classList.remove('opening');
      photoPair.classList.add('folded');
      setTimeout(() => {
        photoL.src = p1; photoR.src = p2;
        photoPair.classList.remove('folded');
        photoPair.classList.add('opening');
        setTimeout(() => photoPair.classList.remove('opening'), 450);
      }, 430);
    }
    typeMessage(messages[i]);
  }

  function nextSlide(){
    slideIdx++;
    if (slideIdx >= messages.length){ showFinal(); return; }
    renderSlide(slideIdx);
    clearTimeout(slideTimer);
    slideTimer = setTimeout(nextSlide, 4800);
  }

  function startSlides(){
    clearTimeout(cuteAutoTimer);
    showScene('slide');
    slideIdx = 0;
    renderSlide(0);
    clearTimeout(slideTimer);
    slideTimer = setTimeout(nextSlide, 4800);
  }
  scenes.slide.addEventListener('click', () => {
    clearTimeout(slideTimer);
    nextSlide();
  });

  /* auto-advance out of the cute scene if the visitor doesn't tap */
  const cuteObserver = new MutationObserver(() => {
    if (scenes.cute.classList.contains('show')){
      clearTimeout(cuteAutoTimer);
      cuteAutoTimer = setTimeout(startSlides, 3800);
    }
  });
  cuteObserver.observe(scenes.cute, { attributes:true, attributeFilter:['class'] });

  /* ---------------- final heart-shaped photo collage ---------------- */
  function heartPoint(t){
    const x = 16*Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    return { x, y };
  }
  function buildHeartCollage(){
    const container = document.getElementById('heartCollage');
    container.innerHTML = '';
    const W = container.clientWidth || 500, H = container.clientHeight || 460;
    const scale = Math.min(W, H)/32;
    const count = 15;
    const cards = [];
    for (let i=0; i<count; i++){
      const t = (i/count) * Math.PI * 2;
      const pt = heartPoint(t);
      const jitterX = (Math.random()-0.5)*8;
      const jitterY = (Math.random()-0.5)*8;
      const tx = pt.x*scale + jitterX;
      const ty = pt.y*scale + jitterY;
      const rot = Math.random()*24-12;

      const card = document.createElement('div');
      card.className = 'heartCard';
      card.style.setProperty('--tx', tx+'px');
      card.style.setProperty('--ty', ty+'px');
      card.style.setProperty('--rot', rot+'deg');
      card.style.transform = 'translate(' + ((Math.random()-0.5)*14) + 'px,' + ((Math.random()-0.5)*14) + 'px) rotate(' + (Math.random()*30-15) + 'deg) scale(0.55)';
      card.style.zIndex = String(100 - i);
      const img = document.createElement('img');
      img.src = RHEIAN_PHOTOS[i % RHEIAN_PHOTOS.length];
      card.appendChild(img);
      container.appendChild(card);
      cards.push(card);
    }
    // reveal the stacked deck first
    requestAnimationFrame(() => { cards.forEach(c => c.classList.add('stacked')); });
    // then explode outward into the heart shape, staggered
    cards.forEach((card, i) => {
      setTimeout(() => {
        card.style.transform = 'translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1)';
        setTimeout(() => card.classList.add('placed'), 760);
      }, 500 + i*80);
    });
  }
  function showFinal(){
    showScene('final');
    buildHeartCollage();
  }
  window.addEventListener('resize', () => { if (scenes.final.classList.contains('show')) buildHeartCollage(); });

  document.getElementById('replayBtn').addEventListener('click', () => {
    slideIdx = 0;
    showScene('intro');
    runMatrixIntro(goToCute);
  });
})();
</script>

</body>
</html>
